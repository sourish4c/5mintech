# -- Footer Menu --
# The footer menu is displayed at the bottom of the page, just before
# the copyright notice. Configure as per the main menu above.

[[footer]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[footer]]
  name = "Terms & Conditions"
  pageRef = "/pages/terms-and-conditions"
  weight = 20

[[footer]]
  name = "Privacy Policy"
  pageRef = "pages/privacy-policy"
  weight = 30

[[footer]]
  name = "Disclaimer"
  pageRef = "pages/disclaimer"
  weight = 40