# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wake-sa
  namespace: apps
---
# Role — least-privilege access for the wake service
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wake-role
  namespace: apps
rules:
  # GET deployments for /status/<app>; PATCH deployments to stamp the
  # wake.example.com/last-wake annotation (see stamp_wake() in app.py).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  # PATCH the /scale subresource to wake an app (see scale_deployment()).
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list"]
---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wake-binding
  namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wake-role
subjects:
  - kind: ServiceAccount
    name: wake-sa
    namespace: apps
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wake
  namespace: apps
  labels:
    app: wake
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wake
  template:
    metadata:
      labels:
        app: wake
    spec:
      serviceAccountName: wake-sa
      containers:
        - name: wake
          image: wake-service:latest
          # 'latest' + IfNotPresent means a redeploy without changing the
          # tag won't pull a new image. For multi-node, push to a registry
          # and reference an immutable tag.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
# In-cluster ClusterIP Service (used by /node-health, future in-cluster callers)
apiVersion: v1
kind: Service
metadata:
  name: wake
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: wake
  ports:
    - port: 8080
      targetPort: 8080
---
# NodePort Service (dashboard hits this on http://<host>:30080)
apiVersion: v1
kind: Service
metadata:
  name: wake-nodeport
  namespace: apps
spec:
  type: NodePort
  selector:
    app: wake
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
